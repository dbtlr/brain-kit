# brain-kit strict-mode config (typed-note-compatible)
[vault]
root = "."
workspaces_dir = "Workspaces"
notes_dir = "Notes"
logs_dir = "Log"
journal_dir = "Journal"
system_dir = "System"

[partner_model]
path = "System/partner_model.md"
log_path = "System/logs/partner_model_log.jsonl"
profile = "default"

[persona]
path = "Notes/me.md"

[mode]
strict = true
